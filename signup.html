<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - WealthBridge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #050505, #160b2b, #050505);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #bdbdbd;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #444;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    .button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      opacity: 0.9;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #aaa;
    }

    .login a {
      color: #a78bfa;
      text-decoration: none;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">W</div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Join WealthBridge
    </p>

    <form onsubmit="createAccount(event)">

      <label for="name">Full Name</label>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
      >

      <label for="confirm">Confirm Password</label>

      <input
        type="password"
        id="confirm"
        placeholder="Confirm your password"
        required
      >

      <button class="button" type="submit">
        Create Account
      </button>

    </form>

    <p class="login">
      Already have an account?
      <a href="login.html">Sign In</a>
    </p>

    <a class="home" href="index.html">
      ← Back to Home
    </a>

  </div>

  <script>
    function createAccount(event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        alert("Passwords do not match.");
        return;
      }

      alert("Account creation will be connected when the secure backend is added.");
    }
  </script>

</body>
</html>
