<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - WealthBridge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #020403,
        #052e16,
        #064e3b,
        #020403
      );
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Green background */
    .background {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(34, 197, 94, 0.35),
        rgba(6, 78, 59, 0.45),
        #020403
      );
      z-index: -5;
    }

    /* Top green glow */
    .glow-top {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 500px;
      background: rgba(34, 197, 94, 0.22);
      filter: blur(90px);
      border-radius: 50%;
      z-index: -4;
      animation: pulse 7s infinite alternate;
    }

    /* Bottom green glow */
    .glow-bottom {
      position: fixed;
      bottom: -250px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 500px;
      background: rgba(16, 185, 129, 0.20);
      filter: blur(90px);
      border-radius: 50%;
      z-index: -4;
      animation: pulse 6s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: translateX(-50%) scale(0.95);
        opacity: 0.4;
      }

      to {
        transform: translateX(-50%) scale(1.1);
        opacity: 0.8;
      }
    }

    .container {
      width: 100%;
      max-width: 430px;

      background: rgba(0, 0, 0, 0.58);

      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 22px;

      padding: 35px 28px;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 0 40px rgba(34, 197, 94, 0.15),
        0 25px 60px rgba(0, 0, 0, 0.6);

      position: relative;
      overflow: hidden;

      animation: fadeIn 0.8s ease;
    }

    /* Animated green line */
    .container::before {
      content: "";
      position: absolute;

      width: 200%;
      height: 3px;

      top: 0;
      left: -100%;

      background: linear-gradient(
        90deg,
        transparent,
        #86efac,
        transparent
      );

      animation: moveLight 4s linear infinite;

      opacity: 0.8;
    }

    @keyframes moveLight {
      from {
        left: -100%;
      }

      to {
        left: 100%;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 60px;
      height: 60px;

      margin: 0 auto 18px;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #22c55e,
        #15803d
      );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;

      border: 1px solid rgba(255,255,255,0.2);

      box-shadow:
        0 0 25px rgba(34, 197, 94, 0.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;

      font-size: 13px;

      color: rgba(255,255,255,0.75);
    }

    input {
      width: 100%;

      height: 48px;

      padding: 0 16px;

      margin-bottom: 18px;

      border: 1px solid rgba(255,255,255,0.1);

      border-radius: 10px;

      background: rgba(255,255,255,0.07);

      color: white;

      outline: none;

      font-size: 15px;

      transition: 0.3s;
    }

    input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    input:focus {
      border-color: rgba(74, 222, 128, 0.65);

      background: rgba(255,255,255,0.11);

      box-shadow:
        0 0 0 3px rgba(34,197,94,0.12);
    }

    .button {
      width: 100%;

      height: 50px;

      border: none;

      border-radius: 10px;

      background: linear-gradient(
        135deg,
        #22c55e,
        #15803d
      );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;

      box-shadow:
        0 10px 30px rgba(34, 197, 94, 0.25);
    }

    .button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 15px 35px rgba(34, 197, 94, 0.4);
    }

    .login {
      text-align: center;

      margin-top: 22px;

      color: rgba(255,255,255,0.55);

      font-size: 14px;
    }

    .login a {
      color: #86efac;

      text-decoration: none;
    }

    .login a:hover {
      color: #bbf7d0;
    }

    .home {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: rgba(255,255,255,0.5);

      text-decoration: none;

      font-size: 14px;
    }

    .home:hover {
      color: white;
    }

    @media (max-width: 480px) {

      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 24px;
      }

    }
  </style>
</head>

<body>

  <div class="background"></div>

  <div class="glow-top"></div>

  <div class="glow-bottom"></div>

  <div class="container">

    <div class="logo">
      W
    </div>

    <h1>
      Create Account
    </h1>

    <p class="subtitle">
      Join WealthBridge
    </p>

    <form onsubmit="createAccount(event)">

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
      >

      <label for="confirm">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirm"
        placeholder="Confirm your password"
        required
      >

      <button
        class="button"
        type="submit"
      >
        Create Account
      </button>

    </form>

    <p class="login">
      Already have an account?
      <a href="./login.html">
        Sign In
      </a>
    </p>

    <a
      class="home"
      href="./index.html"
    >
      ← Back to Home
    </a>

  </div>

  <script>

    function createAccount(event) {

      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirm =
        document.getElementById("confirm").value;

      if (password !== confirm) {

        alert("Passwords do not match.");

        return;
      }

      alert(
        "Account creation will be connected when the secure backend is added."
      );

    }

  </script>

</body>
</html>
