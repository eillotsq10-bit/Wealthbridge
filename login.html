<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | WealthBridge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
      position: relative;
    }

    /* Purple background glow */
    .background {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(168, 85, 247, 0.45),
        rgba(88, 28, 135, 0.5),
        #050505
      );
      z-index: -5;
    }

    .glow-top {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 500px;
      background: rgba(192, 132, 252, 0.22);
      filter: blur(90px);
      border-radius: 50%;
      z-index: -4;
      animation: pulse 7s infinite alternate;
    }

    .glow-bottom {
      position: fixed;
      bottom: -250px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 500px;
      background: rgba(168, 85, 247, 0.2);
      filter: blur(90px);
      border-radius: 50%;
      z-index: -4;
      animation: pulse 6s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: translateX(-50%) scale(0.95);
        opacity: 0.4;
      }

      to {
        transform: translateX(-50%) scale(1.1);
        opacity: 0.8;
      }
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      perspective: 1000px;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      position: relative;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 22px;
      padding: 35px 28px;

      box-shadow:
        0 0 40px rgba(168, 85, 247, 0.15),
        0 25px 60px rgba(0, 0, 0, 0.6);

      overflow: hidden;
    }

    /* Animated border light */
    .login-card::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 3px;
      top: 0;
      left: -100%;
      background: linear-gradient(
        90deg,
        transparent,
        white,
        transparent
      );
      animation: moveLight 4s linear infinite;
      opacity: 0.7;
    }

    @keyframes moveLight {
      from {
        left: -100%;
      }

      to {
        left: 100%;
      }
    }

    .logo-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 0 auto 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,0.2);

      background: rgba(255,255,255,0.06);

      font-size: 20px;
      font-weight: bold;
    }

    .brand {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.7);
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 45px 0 16px;

      background: rgba(255,255,255,0.07);

      border: 1px solid rgba(255,255,255,0.1);

      border-radius: 10px;

      color: white;

      outline: none;

      font-size: 15px;

      transition: 0.3s;
    }

    input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    input:focus {
      border-color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.11);

      box-shadow:
        0 0 0 3px rgba(168,85,247,0.12);
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);

      background: none;
      border: none;

      color: rgba(255,255,255,0.55);

      font-size: 18px;
      cursor: pointer;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 5px 0 25px;

      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;

      color: rgba(255,255,255,0.65);
    }

    .remember input {
      width: auto;
      height: auto;
    }

    a {
      color: #d8b4fe;
      text-decoration: none;
    }

    a:hover {
      color: white;
    }

    .login-button {
      width: 100%;
      height: 50px;

      border: none;
      border-radius: 10px;

      background: linear-gradient(
        135deg,
        #9333ea,
        #6b21a8
      );

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;

      box-shadow:
        0 10px 30px rgba(147, 51, 234, 0.25);
    }

    .login-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 15px 35px rgba(147, 51, 234, 0.4);
    }

    .signup {
      text-align: center;

      margin-top: 25px;

      color: rgba(255,255,255,0.55);

      font-size: 14px;
    }

    .back-home {
      display: block;

      text-align: center;

      margin-top: 22px;

      color: rgba(255,255,255,0.5);

      font-size: 14px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
      }

      .brand {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <div class="glow-top"></div>

  <div class="glow-bottom"></div>

  <div class="login-container">

    <div class="login-card">

      <div class="logo-circle">W</div>

      <h1 class="brand">Welcome Back</h1>

      <p class="subtitle">
        Sign in to continue to WealthBridge
      </p>

      <form id="loginForm">

        <div class="input-group">

          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            required
          >

        </div>

        <div class="input-group">

          <label for="password">Password</label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword()"
            >
              👁
            </button>

          </div>

        </div>

        <div class="options">

          <label class="remember">

            <input type="checkbox">

            Remember me

          </label>

          <a href="#">
            Forgot password?
          </a>

        </div>

        <button
          type="submit"
          class="login-button"
        >
          Sign In →
        </button>

      </form>

      <div class="signup">

        Don't have an account?

        <a href="#">
          Create account
        </a>

      </div>

      <a
        href="index.html"
        class="back-home"
      >
        ← Back to Home
      </a>

    </div>

  </div>

  <script>

    function togglePassword() {

      const password =
        document.getElementById("password");

      if (password.type === "password") {

        password.type = "text";

      } else {

        password.type = "password";

      }

    }

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        alert(
          "Login authentication will be connected when the backend is added."
        );

      });

  </script>

</body>
</html>
